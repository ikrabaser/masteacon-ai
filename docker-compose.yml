services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_knowledge_assistant
    ports:
      # Bound to loopback only — the database must never be reachable from
      # outside this machine, in dev or in production. Service-to-service
      # traffic (api/celery_worker -> postgres) goes over the internal
      # Docker network regardless and is unaffected by this.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_knowledge_assistant
      REDIS_URL: redis://redis:6379/0
    ports:
      # Loopback-only, same reasoning as postgres/redis above — in
      # production, Caddy (docker-compose.prod.yml) reaches this container
      # over the internal Docker network via `frontend`'s own /api/ proxy,
      # never through this host-published port.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_knowledge_assistant
      REDIS_URL: redis://redis:6379/0
      # Only `api` runs migrations — see docker-entrypoint.sh for why running
      # them from both services concurrently is unsafe.
      RUN_MIGRATIONS: "false"
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin: the browser calls /api/... on whatever host
        # served the page, and nginx.conf reverse-proxies that to the `api`
        # service internally. This is what lets the exact same image serve
        # both local Docker Compose and production behind any domain,
        # without baking a specific API URL into the built JS bundle.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      # Loopback-only in this base file for the same reason as the other
      # services — visit it directly at http://localhost:5173 in dev. In
      # production this port is never used at all: Caddy
      # (docker-compose.prod.yml) reaches this container over the internal
      # Docker network via its service name, not through a host port.
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
